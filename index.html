<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner POS Cepat (Online) - Milangkala 44</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-color: #04091a;
      --card-bg: rgba(13, 30, 72, 0.95);
      --gold: #fbbf24;
      --gold-grad: linear-gradient(180deg, #ffe082 0%, #f59e0b 55%, #d97706 100%);
      --text: #f8fafc;
      --success: #10b981;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 500px; }
    .header h1 { font-size: 1.4rem; color: var(--gold); font-weight: 800; text-transform: uppercase; }
    .header p { font-size: 0.8rem; color: #cbd5e1; margin-top: 5px; }

    .card { background: var(--card-bg); border: 2px solid rgba(251, 191, 36, 0.4); border-radius: 16px; padding: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
    
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 10px; border-radius: 10px; border: 1.5px solid rgba(56, 189, 248, 0.4); background: rgba(6, 14, 36, 0.9); color: white; font-size: 1rem; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 800; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s; }
    .btn-gold { background: var(--gold-grad); color: #08122c; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); margin-bottom: 10px; }
    .btn-gold:active { transform: scale(0.98); }
    .btn-stop { background: #1e293b; color: white; border: 1.5px solid #475569; display: none; }

    /* Area Kamera & Overlay Feedback Cepat */
    .reader-container { position: relative; width: 100%; max-width: 500px; border-radius: 12px; overflow: hidden; display: none; border: 2px dashed var(--gold); margin-bottom: 15px; }
    #reader { width: 100%; }
    
    .flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; }
    .flash-overlay.show-success { opacity: 1; background: rgba(16, 185, 129, 0.85); backdrop-filter: blur(4px); }
    
    .flash-icon { font-size: 4rem; margin-bottom: 10px; }
    .flash-text { font-size: 1.2rem; font-weight: 800; color: white; text-align: center; padding: 0 10px; }

    /* Log Riwayat Live */
    .log-container { width: 100%; max-width: 500px; background: rgba(6, 14, 36, 0.9); border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px; display: none; max-height: 250px; overflow-y: auto; }
    .log-title { font-size: 0.8rem; font-weight: 800; color: var(--gold); margin-bottom: 10px; text-transform: uppercase; text-align: center; }
    .log-item { padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; border-left: 4px solid transparent; animation: slideIn 0.3s ease-out; }
    .log-item.success { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: #a7f3d0; }
    .log-item.error { background: rgba(244, 63, 94, 0.15); border-color: var(--danger); color: #fecdd3; }
    .log-item.pending { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; color: #bae6fd; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Scanner Cepat (Online)</h1>
    <p>Scan beruntun, kamera tidak mati, data langsung ke server.</p>
  </div>

  <div class="card" id="setupCard">
    <div class="form-group">
      <label class="form-label">TUGAS POS CHECKPOINT</label>
      <select id="posSelect" class="form-select">
        <option value="1">POS 1 – START</option>
        <option value="2">POS 2 – CHECKPOINT</option>
        <option value="3">POS 3 – FINISH</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">NAMA PETUGAS</label>
      <input type="text" id="officerName" class="form-input" placeholder="Misal: PETUGAS POS 1" required>
    </div>
    
    <button class="btn btn-gold" id="btnStartScan" onclick="startScanner()">📷 Mulai Scan Live</button>
    <button class="btn btn-stop" id="btnStopScan" onclick="stopScanner()">Tutup Kamera</button>
  </div>

  <!-- Area Kamera dengan Flash Overlay Cepat -->
  <div class="reader-container" id="readerContainer">
    <div id="reader"></div>
    <div class="flash-overlay" id="flashOverlay">
      <div class="flash-icon">📸</div>
      <div class="flash-text">Terekam!</div>
    </div>
  </div>

  <!-- Log Respon Server Live -->
  <div class="log-container" id="logContainer">
    <div class="log-title">Live Server Log</div>
    <div id="logList"></div>
  </div>

  <script>
    /**
     * ==========================================================
     * URL API GOOGLE APPS SCRIPT ANDA
     * ==========================================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbyrjVOusQ__ChTzgTSM8QdXSiyZl4W0H-bLfJmxgrb2JxRq_R867b4QxeBUYFODuiaSAw/exec";

    let html5QrcodeScanner = null;
    let isScanning = false;
    
    // Variabel untuk mencegah double-scan beruntun
    let lastScannedToken = "";
    let lastScannedTime = 0;
    let scanCounter = 0; // ID unik untuk log

    // Memulai Kamera
    function startScanner() {
      const officer = document.getElementById('officerName').value.trim();
      if (!officer || officer.length < 2) {
        alert("Mohon isi nama petugas terlebih dahulu!");
        return;
      }
      
      document.getElementById('readerContainer').style.display = 'block';
      document.getElementById('logContainer').style.display = 'block';
      document.getElementById('btnStartScan').style.display = 'none';
      document.getElementById('btnStopScan').style.display = 'block';

      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
      
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
      .then(() => { isScanning = true; })
      .catch((err) => {
        alert("Gagal mengakses kamera. Error: " + err);
        stopScanner();
      });
    }

    // Menghentikan Kamera
    function stopScanner() {
      if (html5QrcodeScanner && isScanning) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          isScanning = false;
        }).catch(err => console.log(err));
      }
      document.getElementById('readerContainer').style.display = 'none';
      document.getElementById('btnStartScan').style.display = 'block';
      document.getElementById('btnStopScan').style.display = 'none';
    }

    // Dieksekusi seketika saat QR Terbaca
    function onScanSuccess(decodedText, decodedResult) {
      if (!isScanning) return;
      
      const now = Date.now();
      // Cegah scan QR yang SAMA berulang kali dalam 3 detik (Cooldown anti-dobel)
      if (decodedText === lastScannedToken && (now - lastScannedTime) < 3000) {
        return;
      }

      lastScannedToken = decodedText;
      lastScannedTime = now;
      scanCounter++;
      const currentLogId = "log-" + scanCounter;

      // 1. Beri Feedback Instan ke Petugas (Beep + Kedip Layar)
      playAudioTone('beep');
      showFlashFeedback();

      // 2. Siapkan Data
      const posValue = document.getElementById('posSelect').value;
      const officerValue = document.getElementById('officerName').value.trim();
      
      const payload = {
        action: "scanCheckpoint",
        pos: posValue,
        petugas: officerValue,
        token_qr: decodedText
      };

      // 3. Tampilkan Log 'Sedang Mengirim'
      addLog(currentLogId, 'pending', `⏳ Mengirim: ${decodedText.substring(0,8)}...`);

      // 4. Kirim ke Server secara Asynchronous (Latar Belakang)
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if(data.success) {
          updateLog(currentLogId, 'success', `✅ Berhasil: No.${data.nomor} (${data.nama})`);
          playAudioTone('success'); // Beep sukses dari server
        } else {
          updateLog(currentLogId, 'error', `⛔ Ditolak: ${data.message}`);
          playAudioTone('error'); // Beep error dari server (pos salah/dobel)
        }
      })
      .catch(error => {
        updateLog(currentLogId, 'error', `⚠️ Koneksi Error saat mengirim kode.`);
        playAudioTone('error');
      });
    }

    function onScanFailure(error) {
      // Abaikan error dari frame kamera kosong
    }

    // Animasi Kilat Overlay Tanpa Menghentikan Kamera
    function showFlashFeedback() {
      const overlay = document.getElementById('flashOverlay');
      overlay.className = 'flash-overlay show-success';
      
      // Hilangkan overlay setelah 0.4 detik agar kamera terlihat lagi
      setTimeout(() => {
        overlay.className = 'flash-overlay';
      }, 400);
    }

    // Menambah Log Live di bawah Kamera
    function addLog(id, status, text) {
      const logList = document.getElementById('logList');
      const div = document.createElement('div');
      div.id = id;
      div.className = `log-item ${status}`;
      div.innerHTML = `<strong>${new Date().toLocaleTimeString('id-ID')}</strong> - ${text}`;
      
      // Masukkan ke paling atas
      logList.insertBefore(div, logList.firstChild);
      
      // Batasi maksimal 15 log terakhir agar tidak memberatkan HP
      if (logList.children.length > 15) {
        logList.removeChild(logList.lastChild);
      }
    }

    // Memperbarui Log setelah balasan Server diterima
    function updateLog(id, status, text) {
      const div = document.getElementById(id);
      if(div) {
        div.className = `log-item ${status}`;
        div.innerHTML = `<strong>${new Date().toLocaleTimeString('id-ID')}</strong> - ${text}`;
      }
    }

    // Manajemen Audio
    function playAudioTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'beep') {
          // Bunyi "Tit" cepat saat kode berhasil tertangkap kamera
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1000, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'success') {
          // Bunyi melodi pendek saat data valid di server
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'error') {
          // Bunyi tet-tot saat ditolak server / error jaringan
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(250, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.4, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch(e) { console.log("Audio not supported"); }
    }
  </script>
</body>
</html>
