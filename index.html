<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#04091a">
  <meta name="description" content="Aplikasi Scan QR Gelang untuk panitia Milangkala Desa Kutawaringin ke-44.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scan QR Gelang">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Scan QR Gelang</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Library QR Scanner yang Handal untuk HP -->
  <script src="./vendor/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #04091a;
      --card-bg: rgba(13, 30, 72, 0.95);
      --gold: #fbbf24;
      --gold-grad: linear-gradient(180deg, #ffe082 0%, #f59e0b 55%, #d97706 100%);
      --text: #f8fafc;
      --success: #10b981;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
    .header h1 { font-size: 1.4rem; color: var(--gold); font-weight: 800; text-transform: uppercase; }
    .header p { font-size: 0.8rem; color: #cbd5e1; margin-top: 5px; }

    .card { background: var(--card-bg); border: 2px solid rgba(251, 191, 36, 0.4); border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid rgba(56, 189, 248, 0.4); background: rgba(6, 14, 36, 0.9); color: white; font-size: 1rem; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s; }
    .btn-gold { background: var(--gold-grad); color: #08122c; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
    .btn-gold:active { transform: scale(0.98); }
    .btn-stop { background: #1e293b; color: white; border: 1.5px solid #475569; margin-top: 10px; display: none; }
    .btn:disabled { opacity: .65; cursor: wait; }
    .photo-corners {
      position:absolute; inset:18%; pointer-events:none;
      border:0 solid transparent;
      background:
        linear-gradient(#fff,#fff) left top/34px 5px no-repeat,
        linear-gradient(#fff,#fff) left top/5px 34px no-repeat,
        linear-gradient(#fff,#fff) right top/34px 5px no-repeat,
        linear-gradient(#fff,#fff) right top/5px 34px no-repeat,
        linear-gradient(#fff,#fff) left bottom/34px 5px no-repeat,
        linear-gradient(#fff,#fff) left bottom/5px 34px no-repeat,
        linear-gradient(#fff,#fff) right bottom/34px 5px no-repeat,
        linear-gradient(#fff,#fff) right bottom/5px 34px no-repeat;
    }

    #reader {
      width: min(100%, 500px);
      aspect-ratio: 1 / 1;
      height: auto;
      max-height: 92vw;
      margin: 15px auto 0;
      border-radius: 16px;
      overflow: hidden;
      border: 2px dashed var(--gold);
      display: none;
      position: relative;
      background: #000;
    }
    #reader video, #reader canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    
    .result-box { display: none; margin-top: 15px; padding: 15px; border-radius: 12px; text-align: center; border: 2px solid transparent; }
    .result-box.success { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #a7f3d0; }
    .result-box.error { background: rgba(244, 63, 94, 0.2); border-color: var(--danger); color: #fecdd3; }
    .result-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
    .result-detail { font-size: 0.9rem; line-height: 1.5; }

    #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 9, 26, 0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { width: 50px; height: 50px; border: 5px solid rgba(251, 191, 36, 0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Scanner POS FINISH</h1>
    <p>Sistem Milangkala Desa Kutawaringin Ke-44</p>
  </div>

  <div id="installArea" style="width:100%;max-width:500px;margin:-8px 0 14px;display:none;">
    <button class="btn btn-gold" id="installAppBtn" type="button">⬇️ Instal Aplikasi di HP</button>
    <div id="installHint" style="color:#cbd5e1;font-size:.75rem;text-align:center;margin-top:7px;">
      Pasang scanner di layar utama HP agar mudah dibuka.
    </div>
  </div>

  <div class="card" id="setupCard">
    <div class="form-group">
      <label class="form-label">LOKASI SCAN</label>
      <div class="form-input" style="font-weight:800; color:var(--gold); text-align:center; letter-spacing:1px;">
        🏁 POS FINISH
      </div>
      <input type="hidden" id="posSelect" value="3">
    </div>
    <div class="form-group">
      <label class="form-label">NAMA PETUGAS LAPANGAN</label>
      <input type="text" id="officerName" class="form-input" placeholder="Ketik nama Anda (misal: PETUGAS 1)" required>
    </div>
    <button class="btn btn-gold" id="btnStartScan" onclick="startScanner()">📷 Scan Live Otomatis</button>
    <button class="btn btn-gold" id="btnPhotoScan" type="button" onclick="startPhotoCamera()" style="margin-top:10px;">📸 Scan Foto — Tekan Tombol Foto</button>
    <button class="btn btn-stop" id="btnStopScan" onclick="stopScanner()">Jeda Scanner</button>
  </div>

  <div id="reader"></div>

  <div id="photoCameraPanel" style="display:none;width:min(100%,500px);margin:15px auto 0;text-align:center;">
    <div id="photoVideoFrame" style="position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border:2px dashed var(--gold);border-radius:16px;background:#000;">
      <video id="photoVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>
      <div class="photo-corners" aria-hidden="true"></div>
      <div id="photoBusy" style="display:none;position:absolute;inset:0;background:#0009;color:white;align-items:center;justify-content:center;font-weight:900;">MEMBACA QR FOTO…</div>
    </div>
    <canvas id="photoCanvas" style="display:none;"></canvas>
    <button class="btn btn-gold" id="btnShutter" type="button" onclick="capturePhotoQr()" style="margin-top:14px;border-radius:999px;min-height:64px;font-size:1.05rem;">● AMBIL FOTO GELANG</button>
    <button class="btn btn-stop" id="btnClosePhotoCamera" type="button" onclick="closePhotoCamera()" style="display:block;">Tutup Kamera Foto</button>
  </div>
  <div id="photoReader" style="display:none;width:1px;height:1px;overflow:hidden;"></div>
  <div id="networkStatus" style="width:100%;max-width:500px;text-align:center;color:#cbd5e1;font-size:.82rem;font-weight:800;margin:8px 0 4px;">MEMERIKSA KONEKSI…</div>
  <div id="scannerStatus" style="width:100%;max-width:500px;text-align:center;color:#fbbf24;font-size:.85rem;font-weight:700;margin:4px 0 6px;">Scanner belum aktif.</div>
  <div id="queueStatus" style="width:100%;max-width:500px;text-align:center;color:#cbd5e1;font-size:.82rem;margin-bottom:12px;">ANTRIAN: 0 | BERHASIL: 0 | DITOLAK: 0</div>

  <div class="card result-box" id="resultBox" style="position:relative; z-index:2;">
    <div class="result-title" id="resultTitle">STATUS SCAN</div>
    <div class="result-detail" id="resultDetail">Detail akan muncul di sini.</div>
    <button class="btn btn-gold" style="margin-top:15px; padding:10px;" onclick="dismissResult()">Lanjut Scan</button>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold); font-weight:700;">Memvalidasi QR Code...</div>
  </div>

  <script>
    /**
     * ==========================================================
     * PENTING: TEMPEL URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
     * ==========================================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbyrjVOusQ__ChTzgTSM8QdXSiyZl4W0H-bLfJmxgrb2JxRq_R867b4QxeBUYFODuiaSAw/exec";

    let html5QrcodeScanner = null;
    let photoQrReader = null;
    let photoCameraStream = null;
    let isScanning = false;
    let isStarting = false;
    let isPhotoProcessing = false;
    let isProcessing = false;

    // Antrean disimpan di perangkat dan TIDAK dihapus saat kamera dijeda/dimatikan.
    // Tidak ada batas buatan seperti 20 QR; kapasitas akhirnya mengikuti ruang penyimpanan browser.
    const QUEUE_STORAGE_KEY = "kutawaringin_scan_queue_v3";
    const PROCESSED_STORAGE_KEY = "kutawaringin_processed_codes_v3";
    const STATS_STORAGE_KEY = "kutawaringin_scan_stats_v3";
    const REQUEST_TIMEOUT_MS = 20000;
    const scanQueue = [];
    const pendingCodes = new Set();
    const processedCodes = new Set();
    let successCount = 0;
    let rejectCount = 0;
    let retryNotBefore = 0;
    let scanAudioContext = null;

    function loadSavedData() {
      try {
        const savedQueue = JSON.parse(localStorage.getItem(QUEUE_STORAGE_KEY) || "[]");
        if (Array.isArray(savedQueue)) {
          savedQueue.forEach(item => {
            if (item && item.qrText && !processedCodes.has(String(item.qrText))) {
              const code = String(item.qrText);
              if (!pendingCodes.has(code)) {
                scanQueue.push({
                  qrText: code,
                  petugas: String(item.petugas || ""),
                  addedAt: Number(item.addedAt || Date.now()),
                  attempts: Number(item.attempts || 0)
                });
                pendingCodes.add(code);
              }
            }
          });
        }

        const savedProcessed = JSON.parse(localStorage.getItem(PROCESSED_STORAGE_KEY) || "[]");
        if (Array.isArray(savedProcessed)) {
          savedProcessed.forEach(code => processedCodes.add(String(code)));
        }

        const stats = JSON.parse(localStorage.getItem(STATS_STORAGE_KEY) || "{}");
        successCount = Number(stats.successCount || 0);
        rejectCount = Number(stats.rejectCount || 0);

        // Hapus item antrean yang ternyata sudah tercatat selesai.
        for (let i = scanQueue.length - 1; i >= 0; i--) {
          if (processedCodes.has(scanQueue[i].qrText)) {
            pendingCodes.delete(scanQueue[i].qrText);
            scanQueue.splice(i, 1);
          }
        }
      } catch (err) {
        console.warn("Tidak dapat membaca antrean tersimpan:", err);
      }
      updateQueueStatus();
    }

    function persistQueue() {
      try {
        localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify(scanQueue));
        localStorage.setItem(PROCESSED_STORAGE_KEY, JSON.stringify(Array.from(processedCodes).slice(-20000)));
        localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify({ successCount, rejectCount }));
        return true;
      } catch (err) {
        console.error("Gagal menyimpan antrean di perangkat:", err);
        setScannerStatus("PERINGATAN: PENYIMPANAN PENUH. Hentikan scan dan periksa ruang browser.");
        return false;
      }
    }

    // Bunyi beep pendek hanya saat QR baru diterima kamera.
    // Tidak ada bunyi sukses/gagal dan tidak ada pembacaan nama peserta.
    function prepareScanSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!scanAudioContext) scanAudioContext = new AudioCtx();
        if (scanAudioContext.state === "suspended") scanAudioContext.resume();
      } catch (err) {
        console.warn("Audio scanner tidak tersedia:", err);
      }
    }

    function playScanBeep() {
      try {
        if (!scanAudioContext) return;
        if (scanAudioContext.state === "suspended") scanAudioContext.resume();
        const ctx = scanAudioContext;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        osc.type = "sine";
        osc.frequency.setValueAtTime(1050, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch (err) {
        console.warn("Gagal memutar beep scan:", err);
      }
    }

    function updateQueueStatus() {
      const el = document.getElementById('queueStatus');
      if (el) {
        el.textContent = `ANTRIAN: ${scanQueue.length}${isProcessing ? ' (1 DIUPLOAD)' : ''} | BERHASIL: ${successCount} | DITOLAK: ${rejectCount}`;
      }
    }

    function setScannerStatus(message) {
      const status = document.getElementById('scannerStatus');
      if (status) status.textContent = message;
    }

    async function ensureLocalStorageReady() {
      // Minta browser mempertahankan data antrean walau ruang penyimpanan sedang dibersihkan.
      // Persetujuan persistensi bergantung pada kebijakan browser/perangkat.
      try {
        if (navigator.storage && navigator.storage.persist) {
          await navigator.storage.persist();
        }
        const testKey = "kutawaringin_storage_test";
        localStorage.setItem(testKey, "ok");
        if (localStorage.getItem(testKey) !== "ok") throw new Error("Penyimpanan lokal tidak dapat diverifikasi.");
        localStorage.removeItem(testKey);
        return true;
      } catch (err) {
        console.error("Penyimpanan lokal tidak siap:", err);
        alert("PENYIMPANAN HP TIDAK SIAP. Scan dibatalkan agar data peserta tidak hilang. Periksa ruang penyimpanan browser dan coba lagi.");
        setScannerStatus("GAGAL: PENYIMPANAN LOKAL TIDAK TERSEDIA — SCAN TIDAK DIMULAI.");
        return false;
      }
    }

    async function startScanner() {
      if (isScanning || isStarting) return;

      if (!(await ensureLocalStorageReady())) return;
      const officer = document.getElementById('officerName').value.trim();
      if (!officer || officer.length < 2) {
        alert("Mohon isi nama petugas terlebih dahulu!");
        document.getElementById('officerName').focus();
        return;
      }
      if (!window.Html5Qrcode) {
        alert("Library scanner offline belum tersedia. Saat masih online, pastikan file vendor/html5-qrcode.min.js sudah ada di GitHub, buka aplikasi sekali sampai terpasang, lalu coba lagi.");
        return;
      }

      prepareScanSound();
      isStarting = true;
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('btnStartScan').style.display = 'none';
      document.getElementById('btnStopScan').style.display = 'block';
      setScannerStatus("Mencari kamera belakang...");

      try {
        html5QrcodeScanner = new Html5Qrcode("reader", {
          verbose: false,
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
        });

        const config = {
          // FPS moderat membantu decoding stabil pada HP kelas menengah.
          fps: 20,
          qrbox: (viewWidth, viewHeight) => {
            const side = Math.max(220, Math.min(360, Math.floor(Math.min(viewWidth, viewHeight) * 0.78)));
            return { width: side, height: side };
          },
          aspectRatio: 1.0,
          disableFlip: true
        };

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          throw new Error("Tidak ada kamera yang terdeteksi pada perangkat.");
        }

        const rearCamera = cameras.find(camera =>
          /back|rear|environment|belakang|traseira|arrière/i.test(camera.label || "")
        );
        const cameraConfig = rearCamera
          ? rearCamera.id
          : { facingMode: { ideal: "environment" } };

        await html5QrcodeScanner.start(cameraConfig, config, onScanSuccess, onScanFailure);
        isScanning = true;

        // Optimalkan ketajaman gambar dan autofocus jika didukung perangkat.
        try {
          await html5QrcodeScanner.applyVideoConstraints({
            width: { ideal: 1280 },
            height: { ideal: 720 }
          });
        } catch (resolutionErr) {
          console.info("Resolusi kamera default digunakan pada perangkat ini.");
        }
        try {
          await html5QrcodeScanner.applyVideoConstraints({
            advanced: [
              { focusMode: "continuous" },
              { exposureMode: "continuous" },
              { whiteBalanceMode: "continuous" }
            ]
          });
        } catch (focusErr) {
          console.info("Autofocus kontinu tidak didukung; kamera memakai fokus otomatis bawaan.");
        }

        setScannerStatus("● KAMERA AKTIF — AUTOFOCUS AKTIF, ARAHKAN QR GELANG KE KOTAK SCAN");
        // Upload antrean lama tetap berjalan meskipun scanner baru saja dinyalakan.
        processScanQueue();
      } catch (err) {
        console.error("Gagal memulai kamera:", err);
        alert("Gagal mengakses kamera. Izinkan kamera dan buka melalui HTTPS. " + (err.message || err));
        await stopScanner();
      } finally {
        isStarting = false;
      }
    }

    async function stopScanner() {
      setScannerStatus("KAMERA DIHENTIKAN — ANTREAN TETAP TERSIMPAN DAN UPLOAD DILANJUTKAN.");
      if (html5QrcodeScanner) {
        try {
          if (isScanning) await html5QrcodeScanner.stop();
          html5QrcodeScanner.clear();
        } catch (err) {
          console.warn("Gagal menghentikan kamera:", err);
        }
      }
      isScanning = false;
      isStarting = false;
      // PENTING: jangan kosongkan scanQueue atau pendingCodes di sini.
      persistQueue();
      updateQueueStatus();
      document.getElementById('reader').style.display = 'none';
      document.getElementById('btnStartScan').style.display = 'block';
      document.getElementById('btnStopScan').style.display = 'none';
      processScanQueue();
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      enqueueDecodedQr(decodedText, "LIVE");
    }

    // Kedua mode (LIVE dan FOTO) memakai antrean lokal yang sama.
    function enqueueDecodedQr(decodedText, sourceMode) {
      const qrText = String(decodedText || '').trim();
      if (!qrText || processedCodes.has(qrText) || pendingCodes.has(qrText)) {
        if (sourceMode === "FOTO") {
          setScannerStatus("QR SUDAH PERNAH MASUK / SEDANG DIANTREKAN — FOTO GELANG BERIKUTNYA.");
        }
        return false;
      }

      const officer = document.getElementById('officerName').value.trim();
      const queueItem = {
        qrText,
        petugas: officer,
        addedAt: Date.now(),
        attempts: 0
      };

      scanQueue.push(queueItem);
      pendingCodes.add(qrText);
      if (!persistQueue()) {
        setScannerStatus("BAHAYA: QR " + qrText + " TERTANGKAP TETAPI GAGAL DISIMPAN. HENTIKAN SCAN.");
        updateQueueStatus();
        if (sourceMode === "LIVE") stopScanner();
        alert("Penyimpanan lokal gagal. QR " + qrText + " belum dapat dipastikan tersimpan. Hentikan scan, periksa ruang penyimpanan HP, lalu verifikasi nomor ini.");
        return false;
      }

      setScannerStatus("✓ QR " + qrText + " AMAN DI ANTREAN HP — " +
        (navigator.onLine ? "MENUNGGU UPLOAD" : "OFFLINE, AKAN DIUPLOAD SAAT ONLINE"));
      playScanBeep();
      updateQueueStatus();
      processScanQueue();
      return true;
    }

    // MODE FOTO MANUAL: buka preview kamera di dalam aplikasi, petugas menekan tombol rana.
    async function startPhotoCamera() {
      if (isScanning || isStarting) {
        alert("Jeda Scan Live terlebih dahulu sebelum menggunakan Scan Foto.");
        return;
      }
      if (photoCameraStream) return;
      if (isPhotoProcessing) return;

      const officer = document.getElementById('officerName').value.trim();
      if (!officer || officer.length < 2) {
        alert("Mohon isi nama petugas terlebih dahulu!");
        document.getElementById('officerName').focus();
        return;
      }
      if (!(await ensureLocalStorageReady())) return;
      if (!window.Html5Qrcode || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Kamera manual tidak tersedia. Pastikan aplikasi dibuka melalui HTTPS dan library QR lokal sudah terpasang.");
        return;
      }

      try {
        prepareScanSound();
        setScannerStatus("MEMBUKA KAMERA BELAKANG...");
        photoCameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1920 }
          }
        });

        const video = document.getElementById('photoVideo');
        video.srcObject = photoCameraStream;
        await video.play();

        // Minta autofocus kontinu pada kamera yang mendukungnya.
        const track = photoCameraStream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            await track.applyConstraints({
              advanced: [{ focusMode: "continuous" }]
            });
          } catch (focusError) {
            console.info("Autofocus kontinu tidak didukung; gunakan fokus otomatis bawaan.");
          }
        }

        document.getElementById('photoCameraPanel').style.display = 'block';
        document.getElementById('btnPhotoScan').style.display = 'none';
        document.getElementById('btnStartScan').style.display = 'none';
        document.getElementById('btnStopScan').style.display = 'none';
        setScannerStatus("KAMERA FOTO AKTIF — ARAHKAN QR KE TENGAH, LALU TEKAN AMBIL FOTO GELANG.");
      } catch (err) {
        console.error("Gagal membuka kamera foto:", err);
        closePhotoCamera();
        alert("Kamera tidak dapat dibuka. Izinkan akses kamera untuk situs GitHub Pages, lalu coba lagi.");
        setScannerStatus("KAMERA FOTO GAGAL DIBUKA.");
      }
    }

    async function capturePhotoQr() {
      if (!photoCameraStream || isPhotoProcessing) return;

      const video = document.getElementById('photoVideo');
      if (!video.videoWidth || !video.videoHeight) {
        setScannerStatus("KAMERA BELUM SIAP — TUNGGU SEBENTAR.");
        return;
      }

      isPhotoProcessing = true;
      const shutter = document.getElementById('btnShutter');
      const busy = document.getElementById('photoBusy');
      shutter.disabled = true;
      shutter.textContent = "⏳ MEMBACA FOTO...";
      busy.style.display = 'flex';

      try {
        // Ambil foto resolusi penuh dari frame kamera saat tombol ditekan.
        const canvas = document.getElementById('photoCanvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d', { willReadFrequently: true });
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const photoBlob = await new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Gagal membuat foto dari kamera.")), "image/jpeg", 0.96);
        });
        const photoFile = new File([photoBlob], "gelang-" + Date.now() + ".jpg", { type: "image/jpeg" });

        // Decode foto di perangkat, tanpa upload gambar ke server.
        photoQrReader = new Html5Qrcode("photoReader", {
          verbose: false,
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
        });
        const decodedText = await photoQrReader.scanFile(photoFile, false);
        const accepted = enqueueDecodedQr(decodedText, "FOTO");

        if (accepted) {
          setScannerStatus("✓ QR " + String(decodedText).trim() + " TERSIMPAN DI ANTREAN — ARAHKAN KE GELANG BERIKUTNYA.");
        } else {
          setScannerStatus("QR SUDAH PERNAH MASUK ANTREAN / SUDAH TERCATAT — SILAKAN FOTO GELANG BERIKUTNYA.");
        }
      } catch (err) {
        console.warn("QR tidak terbaca dari foto kamera:", err);
        setScannerStatus("QR TIDAK TERBACA — DEKATKAN, LURUSKAN, DAN PASTIKAN CAHAYA CUKUP, LALU TEKAN FOTO LAGI.");
        alert("QR belum terbaca. Kamera tetap aktif. Atur ulang posisi gelang, pastikan QR tidak buram atau tertutup, lalu tekan AMBIL FOTO GELANG lagi.");
      } finally {
        try {
          if (photoQrReader) photoQrReader.clear();
        } catch (clearErr) {
          console.info("Pembersihan pembaca foto:", clearErr);
        }
        photoQrReader = null;
        isPhotoProcessing = false;
        shutter.disabled = false;
        shutter.textContent = "● AMBIL FOTO GELANG";
        busy.style.display = 'none';
      }
    }

    function closePhotoCamera() {
      if (photoCameraStream) {
        photoCameraStream.getTracks().forEach(track => track.stop());
        photoCameraStream = null;
      }
      const video = document.getElementById('photoVideo');
      if (video) video.srcObject = null;
      const panel = document.getElementById('photoCameraPanel');
      if (panel) panel.style.display = 'none';
      const photoButton = document.getElementById('btnPhotoScan');
      if (photoButton) photoButton.style.display = 'block';
      const liveButton = document.getElementById('btnStartScan');
      if (liveButton) liveButton.style.display = 'block';
      const stopButton = document.getElementById('btnStopScan');
      if (stopButton) stopButton.style.display = 'none';
      setScannerStatus("KAMERA FOTO DITUTUP — ANTREAN TETAP TERSIMPAN.");
      processScanQueue();
    }

    async function processScanQueue() {
      if (isProcessing || scanQueue.length === 0) return;
      if (!navigator.onLine) {
        setScannerStatus("OFFLINE — " + scanQueue.length + " QR TERSIMPAN DI HP. UPLOAD OTOMATIS SAAT INTERNET KEMBALI.");
        updateQueueStatus();
        return;
      }
      if (Date.now() < retryNotBefore) return;
      isProcessing = true;
      updateQueueStatus();

      while (scanQueue.length > 0) {
        const item = scanQueue[0];
        const payload = {
          action: "scanCheckpoint",
          pos: "3",
          petugas: item.petugas,
          token_qr: item.qrText
        };

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
          let response;
          try {
            response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(payload),
              cache: "no-store",
              signal: controller.signal
            });
          } finally {
            clearTimeout(timeoutId);
          }

          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();

          // Respons JSON dari server berarti request sudah diproses, baik diterima maupun ditolak.
          scanQueue.shift();
          pendingCodes.delete(item.qrText);
          processedCodes.add(item.qrText);
          if (data && data.success) successCount++;
          else rejectCount++;
          persistQueue();
          updateQueueStatus();
          showResult(data || { success: false, message: "Respons server kosong." });
        } catch (error) {
          console.error("Upload gagal; data tetap berada di antrean:", error);
          item.attempts = Number(item.attempts || 0) + 1;
          persistQueue();
          setScannerStatus(`UPLOAD TERTUNDA — ${scanQueue.length} DATA TERSIMPAN. Mencoba kembali otomatis.`);
          updateQueueStatus();

          // Retry bertahap agar tidak membanjiri Google Apps Script saat jaringan/server bermasalah.
          const retryDelay = Math.min(30000, 1500 * Math.pow(2, Math.min(item.attempts - 1, 4)));
          retryNotBefore = Date.now() + retryDelay;
          isProcessing = false;
          setTimeout(() => {
            retryNotBefore = 0;
            processScanQueue();
          }, retryDelay);
          return;
        }
      }

      isProcessing = false;
      updateQueueStatus();
      if (isScanning) {
        setScannerStatus("● KAMERA AKTIF — SIAP SCAN BERIKUTNYA");
      } else {
        setScannerStatus("KAMERA MATI — SEMUA ANTREAN SUDAH DIUPLOAD.");
      }
    }

    function onScanFailure(error) {
      // Frame tanpa QR adalah kondisi normal; tidak perlu menampilkan pesan.
    }

    // Menampilkan hasil validasi tanpa suara sukses/gagal dan tanpa membacakan nama.
    function showResult(data) {
      const box = document.getElementById('resultBox');
      const title = document.getElementById('resultTitle');
      const detail = document.getElementById('resultDetail');

      box.style.display = 'block';
      box.className = 'card result-box ' + (data.success ? 'success' : 'error');

      if (data.success) {
        title.textContent = "✅ BERHASIL — POS FINISH";
        detail.innerHTML = `
          <strong>Nomor:</strong> ${data.nomor}<br>
          <strong>Nama:</strong> ${data.nama}<br>
          <strong>Status:</strong> ${data.status_peserta}<br>
          <strong>Waktu:</strong> ${data.waktu}
        `;
      } else {
        title.textContent = "⛔ SCAN DITOLAK";
        detail.innerHTML = `
          <strong>Alasan:</strong> ${data.message}<br>
          <strong>Nomor:</strong> ${data.nomor || '-'}<br>
          <strong>Nama:</strong> ${data.nama || '-'}
        `;
      }
    }

    function dismissResult() {
      document.getElementById('resultBox').style.display = 'none';
    }

    function resetScanner() {
      dismissResult();
      if (!isScanning) startScanner();
    }

    function updateNetworkStatus() {
      const el = document.getElementById("networkStatus");
      if (!el) return;
      if (navigator.onLine) {
        el.textContent = "● INTERNET TERSEDIA — ANTREAN AKAN DIUPLOAD";
        el.style.color = "#34d399";
      } else {
        el.textContent = "● MODE OFFLINE — SCAN TETAP TERSIMPAN DI HP";
        el.style.color = "#fbbf24";
      }
    }

    window.addEventListener("online", () => {
      updateNetworkStatus();
      retryNotBefore = 0;
      setScannerStatus("INTERNET KEMBALI — MENGIRIM ANTREAN LAMA TERLEBIH DAHULU.");
      processScanQueue();
    });
    window.addEventListener("offline", () => {
      updateNetworkStatus();
      setScannerStatus("INTERNET TERPUTUS — SCAN BARU TETAP DISIMPAN LOKAL. UPLOAD MENUNGGU.");
    });
    updateNetworkStatus();

    // Pulihkan antrean dari penyimpanan lokal saat halaman dibuka kembali.
    loadSavedData();
    processScanQueue();

    // PWA: daftarkan service worker agar aplikasi dapat dipasang di layar utama.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => {
          console.warn("Service worker belum terdaftar:", err);
        });
      });
    }

    // Tombol instalasi tampil pada browser yang mendukung prompt instalasi.
    let deferredInstallPrompt = null;
    const installArea = document.getElementById("installArea");
    const installButton = document.getElementById("installAppBtn");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      if (installArea) installArea.style.display = "block";
    });

    if (installButton) {
      installButton.addEventListener("click", async () => {
        if (!deferredInstallPrompt) {
          alert("Jika tombol instalasi tidak tersedia: buka menu Chrome (⋮), lalu pilih 'Tambahkan ke layar utama' atau 'Instal aplikasi'.");
          return;
        }
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installArea.style.display = "none";
      });
    }

    window.addEventListener("appinstalled", () => {
      if (installArea) installArea.style.display = "none";
      console.log("Scanner POS FINISH berhasil dipasang.");
    });
  </script>
</body>
</html>
