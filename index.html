<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner POS Cepat - Milangkala 44</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-color: #04091a;
      --card-bg: rgba(13, 30, 72, 0.95);
      --gold: #fbbf24;
      --gold-grad: linear-gradient(180deg, #ffe082 0%, #f59e0b 55%, #d97706 100%);
      --text: #f8fafc;
      --success: #10b981;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 500px; }
    .header h1 { font-size: 1.4rem; color: var(--gold); font-weight: 800; text-transform: uppercase; }
    .header p { font-size: 0.8rem; color: #cbd5e1; margin-top: 5px; }

    .card { background: var(--card-bg); border: 2px solid rgba(251, 191, 36, 0.4); border-radius: 16px; padding: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
    
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 10px; border-radius: 10px; border: 1.5px solid rgba(56, 189, 248, 0.4); background: rgba(6, 14, 36, 0.9); color: white; font-size: 1rem; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 800; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s; }
    .btn-gold { background: var(--gold-grad); color: #08122c; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); margin-bottom: 10px; }
    .btn-gold:active { transform: scale(0.98); }
    .btn-stop { background: #1e293b; color: white; border: 1.5px solid #475569; display: none; }
    .btn-sync { background: #2563eb; color: white; margin-top: 5px; }

    /* Info Bar Offline */
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(6, 14, 36, 0.9); padding: 10px 15px; border-radius: 10px; border: 1px solid var(--gold); margin-bottom: 15px; }
    .status-bar span { font-weight: 700; font-size: 0.85rem; color: var(--gold); }
    .badge { background: var(--danger); color: white; padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; }

    /* Area Kamera & Overlay Feedback Cepat */
    .reader-container { position: relative; width: 100%; max-width: 500px; border-radius: 12px; overflow: hidden; display: none; border: 2px dashed var(--gold); margin-bottom: 15px; }
    #reader { width: 100%; }
    
    .flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; }
    .flash-overlay.show-success { opacity: 1; background: rgba(16, 185, 129, 0.85); backdrop-filter: blur(4px); }
    .flash-overlay.show-warning { opacity: 1; background: rgba(245, 158, 11, 0.85); backdrop-filter: blur(4px); }
    
    .flash-icon { font-size: 4rem; margin-bottom: 10px; }
    .flash-text { font-size: 1.2rem; font-weight: 800; color: white; text-align: center; padding: 0 10px; }

    #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 9, 26, 0.9); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(251, 191, 36, 0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Scanner Cepat (Offline)</h1>
    <p>Scan beruntun, simpan offline, upload saat ada sinyal.</p>
  </div>

  <div class="card" id="setupCard">
    <div class="status-bar">
      <span>Antrean Offline:</span>
      <span class="badge" id="queueCount">0</span>
    </div>

    <div class="form-group">
      <label class="form-label">TUGAS POS CHECKPOINT</label>
      <select id="posSelect" class="form-select">
        <option value="1">POS 1 – START</option>
        <option value="2">POS 2 – CHECKPOINT</option>
        <option value="3">POS 3 – FINISH</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">NAMA PETUGAS</label>
      <input type="text" id="officerName" class="form-input" placeholder="Misal: PETUGAS POS 1" required>
    </div>
    
    <button class="btn btn-gold" id="btnStartScan" onclick="startScanner()">📷 Mulai Scan Peserta</button>
    <button class="btn btn-sync" id="btnSyncData" onclick="syncData()">🔄 Upload Data ke Server</button>
    <button class="btn btn-stop" id="btnStopScan" onclick="stopScanner()">Tutup Kamera</button>
  </div>

  <!-- Area Kamera dengan Flash Overlay Cepat -->
  <div class="reader-container" id="readerContainer">
    <div id="reader"></div>
    <div class="flash-overlay" id="flashOverlay">
      <div class="flash-icon" id="flashIcon">✅</div>
      <div class="flash-text" id="flashText">Tersimpan!</div>
    </div>
  </div>

  <!-- Loading Overlay untuk Sinkronisasi -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold); font-weight:700;" id="syncProgressText">Mengupload data 0 / 0...</div>
  </div>

  <script>
    /**
     * ==========================================================
     * URL API GOOGLE APPS SCRIPT ANDA
     * ==========================================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbyrjVOusQ__ChTzgTSM8QdXSiyZl4W0H-bLfJmxgrb2JxRq_R867b4QxeBUYFODuiaSAw/exec";

    let html5QrcodeScanner = null;
    let isScanning = false;
    let offlineQueue = JSON.parse(localStorage.getItem('qrScannerQueue')) || [];
    
    // Variabel untuk mencegah double-scan beruntun
    let lastScannedToken = "";
    let lastScannedTime = 0;

    // Inisialisasi tampilan awal
    document.addEventListener("DOMContentLoaded", () => {
      updateQueueUI();
    });

    function updateQueueUI() {
      const count = offlineQueue.length;
      const badge = document.getElementById('queueCount');
      badge.textContent = count;
      badge.style.background = count > 0 ? 'var(--danger)' : 'var(--success)';
      document.getElementById('btnSyncData').style.display = count > 0 ? 'block' : 'none';
    }

    // Memulai Kamera
    function startScanner() {
      const officer = document.getElementById('officerName').value.trim();
      if (!officer || officer.length < 2) {
        alert("Mohon isi nama petugas terlebih dahulu!");
        return;
      }
      
      document.getElementById('readerContainer').style.display = 'block';
      document.getElementById('btnStartScan').style.display = 'none';
      document.getElementById('btnSyncData').style.display = 'none';
      document.getElementById('btnStopScan').style.display = 'block';

      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
      
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
      .then(() => { isScanning = true; })
      .catch((err) => {
        alert("Gagal mengakses kamera. Error: " + err);
        stopScanner();
      });
    }

    // Menghentikan Kamera
    function stopScanner() {
      if (html5QrcodeScanner && isScanning) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          isScanning = false;
        }).catch(err => console.log(err));
      }
      document.getElementById('readerContainer').style.display = 'none';
      document.getElementById('btnStartScan').style.display = 'block';
      document.getElementById('btnStopScan').style.display = 'none';
      updateQueueUI(); // Munculkan kembali tombol sync jika ada antrean
    }

    // Eksekusi Sangat Cepat Saat QR Terbaca (0 Detik Delay Server)
    function onScanSuccess(decodedText, decodedResult) {
      if (!isScanning) return;
      
      const now = Date.now();
      // Cegah scan QR yang SAMA berulang kali dalam 3 detik (Cooldown)
      if (decodedText === lastScannedToken && (now - lastScannedTime) < 3000) {
        return;
      }

      lastScannedToken = decodedText;
      lastScannedTime = now;

      // Ambil data form
      const posValue = document.getElementById('posSelect').value;
      const officerValue = document.getElementById('officerName').value.trim();
      const localTime = new Date().toLocaleString('id-ID');

      // 1. Simpan ke Queue Offline
      offlineQueue.push({
        action: "scanCheckpoint",
        pos: posValue,
        petugas: officerValue,
        token_qr: decodedText,
        waktu_scan_lokal: localTime
      });
      localStorage.setItem('qrScannerQueue', JSON.stringify(offlineQueue));
      updateQueueUI();

      // 2. Beri Feedback Instan (Audio & Visual)
      playAudioTone('success');
      showFlashFeedback('success', `Tersimpan!\n${decodedText.substring(0,9)}...`);
    }

    function onScanFailure(error) {
      // Abaikan error dari frame kamera kosong
    }

    // Animasi Kilat Overlay Tanpa Menghentikan Kamera
    function showFlashFeedback(type, text) {
      const overlay = document.getElementById('flashOverlay');
      const icon = document.getElementById('flashIcon');
      const textEl = document.getElementById('flashText');

      overlay.className = 'flash-overlay show-' + type;
      icon.textContent = type === 'success' ? '✅' : '⚠️';
      textEl.innerText = text;

      // Hilangkan overlay setelah 0.6 detik agar kamera terlihat lagi
      setTimeout(() => {
        overlay.className = 'flash-overlay';
      }, 600);
    }

    // Bunyi Beep Sederhana
    function playAudioTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.2);
        }
      } catch(e) { console.log("Audio not supported"); }
    }

    /**
     * ==========================================================
     * PROSES SINKRONISASI MASSAL (Saat Terhubung Wi-Fi/Internet)
     * ==========================================================
     */
    async function syncData() {
      if (offlineQueue.length === 0) {
        alert("Tidak ada data antrean untuk disinkronisasi.");
        return;
      }

      if (!confirm(`Ada ${offlineQueue.length} data scan tersimpan. Upload ke server sekarang? Pastikan internet Anda aktif.`)) {
        return;
      }

      const overlay = document.getElementById('loadingOverlay');
      const progressText = document.getElementById('syncProgressText');
      overlay.style.display = 'flex';

      let successCount = 0;
      let networkErrorCount = 0;
      let remainingQueue = []; // Menyimpan data yang gagal dikirim karena sinyal putus

      for (let i = 0; i < offlineQueue.length; i++) {
        let currentItem = offlineQueue[i];
        progressText.textContent = `Mengupload data ${i + 1} dari ${offlineQueue.length}...`;

        try {
          let response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(currentItem)
          });
          
          let result = await response.json();
          // Apapun balasan server (Valid atau Ditolak karena Pos terlewati/Double), 
          // data sudah berhasil disetorkan ke server, jadi tidak perlu diantrekan lagi.
          successCount++;
          
        } catch (error) {
          // Hanya jika error jaringan / koneksi terputus, data kita simpan kembali ke antrean
          networkErrorCount++;
          remainingQueue.push(currentItem);
        }
      }

      // Update penyimpanan HP dengan sisa data yang gagal terkirim (jika ada)
      offlineQueue = remainingQueue;
      localStorage.setItem('qrScannerQueue', JSON.stringify(offlineQueue));
      updateQueueUI();

      overlay.style.display = 'none';

      let msg = `Sinkronisasi Selesai.\n\nBerhasil Terkirim: ${successCount} data.`;
      if (networkErrorCount > 0) {
        msg += `\n\nGagal (Sinyal Putus): ${networkErrorCount} data. Data gagal masih tersimpan di HP. Silakan cari Wi-Fi lalu tekan Sinkronisasi lagi.`;
      }
      alert(msg);
    }
  </script>
</body>
</html>
