<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#04091a">
  <meta name="description" content="Aplikasi Scan QR Gelang untuk panitia Milangkala Desa Kutawaringin ke-44.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scan QR Gelang">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Scan QR Gelang</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Library QR Scanner yang Handal untuk HP -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #04091a;
      --card-bg: rgba(13, 30, 72, 0.95);
      --gold: #fbbf24;
      --gold-grad: linear-gradient(180deg, #ffe082 0%, #f59e0b 55%, #d97706 100%);
      --text: #f8fafc;
      --success: #10b981;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
    .header h1 { font-size: 1.4rem; color: var(--gold); font-weight: 800; text-transform: uppercase; }
    .header p { font-size: 0.8rem; color: #cbd5e1; margin-top: 5px; }

    .card { background: var(--card-bg); border: 2px solid rgba(251, 191, 36, 0.4); border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid rgba(56, 189, 248, 0.4); background: rgba(6, 14, 36, 0.9); color: white; font-size: 1rem; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s; }
    .btn-gold { background: var(--gold-grad); color: #08122c; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
    .btn-gold:active { transform: scale(0.98); }
    .btn-stop { background: #1e293b; color: white; border: 1.5px solid #475569; margin-top: 10px; display: none; }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px dashed var(--gold); margin-top: 15px; display: none; }
    
    .result-box { display: none; margin-top: 15px; padding: 15px; border-radius: 12px; text-align: center; border: 2px solid transparent; }
    .result-box.success { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #a7f3d0; }
    .result-box.error { background: rgba(244, 63, 94, 0.2); border-color: var(--danger); color: #fecdd3; }
    .result-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
    .result-detail { font-size: 0.9rem; line-height: 1.5; }

    #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 9, 26, 0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { width: 50px; height: 50px; border: 5px solid rgba(251, 191, 36, 0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  
    /* Kamera belakang: area scan ditempatkan paling atas, tepat di bawah header */
    #reader {
      width: 100%;
      max-width: 500px;
      min-height: 0;
      margin: 8px 0 4px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px dashed var(--gold);
      background: #000;
      display: none;
      order: 2;
      box-shadow: 0 0 0 1px rgba(255,215,0,.12), 0 8px 24px rgba(0,0,0,.35);
    }
    #reader video {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-height: 58vh;
      object-fit: cover;
    }
    #reader #qr-shaded-region {
      border-width: 4px !important;
    }
    #scannerStatus, #queueStatus {
      max-width: 500px;
      width: 100%;
      order: 3;
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      #reader { margin-top: 7px; border-radius: 10px; }
      #reader video { max-height: 54vh; }
    }


    /* URUTAN FINAL: HEADER -> KAMERA -> STATUS -> PENGATURAN PETUGAS */
    body { display: flex; flex-direction: column; }
    .header { order: 0; }
    #installArea { order: 1; }
    #reader { order: 2 !important; }
    #scannerStatus, #queueStatus { order: 3 !important; }
    #setupCard { order: 4 !important; }
    #resultBox { order: 5 !important; }

</style>
</head>
<body>

  <div class="header">
    <h1>Scanner POS FINISH</h1>
    <p>Sistem Milangkala Desa Kutawaringin Ke-44</p>
  </div>

  <div id="installArea" style="width:100%;max-width:500px;margin:-8px 0 14px;display:none;">
    <button class="btn btn-gold" id="installAppBtn" type="button">⬇️ Instal Aplikasi di HP</button>
    <div id="installHint" style="color:#cbd5e1;font-size:.75rem;text-align:center;margin-top:7px;">
      Pasang scanner di layar utama HP agar mudah dibuka.
    </div>
  </div>

  <div id="reader"></div>
  <div id="scannerStatus" style="width:100%;max-width:500px;text-align:center;color:#fbbf24;font-size:.85rem;font-weight:700;margin:8px 0 6px;">Scanner belum aktif.</div>
  <div id="queueStatus" style="width:100%;max-width:500px;text-align:center;color:#cbd5e1;font-size:.82rem;margin-bottom:12px;">ANTRIAN: 0 | BERHASIL: 0 | DITOLAK: 0</div>

  <div class="card" id="setupCard">
    <div class="form-group">
      <label class="form-label">LOKASI SCAN</label>
      <div class="form-input" style="font-weight:800; color:var(--gold); text-align:center; letter-spacing:1px;">
        🏁 POS FINISH
      </div>
      <input type="hidden" id="posSelect" value="3">
    </div>
    <div class="form-group">
      <label class="form-label">NAMA PETUGAS LAPANGAN</label>
      <input type="text" id="officerName" class="form-input" placeholder="Ketik nama Anda (misal: PETUGAS 1)" required>
    </div>
    <button class="btn btn-gold" id="btnStartScan" onclick="startScanner()">📷 Buka Kamera Scanner</button>
    <button class="btn btn-stop" id="btnStopScan" onclick="stopScanner()">Jeda Scanner</button>
  </div>

  <div class="card result-box" id="resultBox" style="position:relative; z-index:2;">
    <div class="result-title" id="resultTitle">STATUS SCAN</div>
    <div class="result-detail" id="resultDetail">Detail akan muncul di sini.</div>
    <button class="btn btn-gold" style="margin-top:15px; padding:10px;" onclick="dismissResult()">Lanjut Scan</button>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold); font-weight:700;">Memvalidasi QR Code...</div>
  </div>

  <script>
    /**
     * ==========================================================
     * PENTING: TEMPEL URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
     * ==========================================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbyrjVOusQ__ChTzgTSM8QdXSiyZl4W0H-bLfJmxgrb2JxRq_R867b4QxeBUYFODuiaSAw/exec";

    let html5QrcodeScanner = null;
    let isScanning = false;
    let isStarting = false;
    let isProcessing = false;
    let scanSessionId = 0;

    // Kamera boleh membaca QR berikutnya sambil request server diproses berurutan.
    const scanQueue = [];
    const pendingCodes = new Set();
    const processedCodes = new Set();
    const retryAfterByCode = new Map();
    const MAX_SCAN_QUEUE = 20;
    const REQUEST_TIMEOUT_MS = 15000;
    let successCount = 0;
    let rejectCount = 0;
    const speechQueue = [];

    let isSpeakingQueue = false;

    // Bunyi rana kamera singkat ("cekrek") setiap QR baru berhasil dibaca kamera.
    let scanAudioContext = null;
    function prepareScanSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!scanAudioContext) scanAudioContext = new AudioCtx();
        if (scanAudioContext.state === "suspended") scanAudioContext.resume();
      } catch (err) {
        console.warn("Audio scanner tidak tersedia:", err);
      }
    }

    function playScanShutter() {
      try {
        if (!scanAudioContext) return;
        if (scanAudioContext.state === "suspended") scanAudioContext.resume();

        const ctx = scanAudioContext;
        const now = ctx.currentTime;

        // Klik tajam pertama, disusul klik pendek agar terdengar seperti rana kamera.
        const clicks = [
          { start: 0, duration: 0.035, from: 1550, to: 820, volume: 0.16 },
          { start: 0.055, duration: 0.045, from: 1050, to: 520, volume: 0.12 }
        ];

        clicks.forEach(click => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(click.from, now + click.start);
          osc.frequency.exponentialRampToValueAtTime(click.to, now + click.start + click.duration);
          gain.gain.setValueAtTime(0.0001, now + click.start);
          gain.gain.exponentialRampToValueAtTime(click.volume, now + click.start + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + click.start + click.duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + click.start);
          osc.stop(now + click.start + click.duration + 0.005);
        });
      } catch (err) {
        console.warn("Gagal memutar bunyi scan:", err);
      }
    }

    function updateQueueStatus() {
      const el = document.getElementById('queueStatus');
      if (el) {
        el.textContent = `ANTRIAN: ${scanQueue.length}${isProcessing ? ' (1 DIPROSES)' : ''} | BERHASIL: ${successCount} | DITOLAK: ${rejectCount}`;
      }
    }

    function setScannerStatus(message) {
      const status = document.getElementById('scannerStatus');
      if (status) status.textContent = message;
    }

    // Memulai kamera belakang dengan resolusi yang cukup untuk QR gelang.
    async function startScanner() {
      if (isScanning || isStarting) return;

      const officer = document.getElementById('officerName').value.trim();
      if (!officer || officer.length < 2) {
        alert("Mohon isi nama petugas terlebih dahulu!");
        document.getElementById('officerName').focus();
        return;
      }
      if (!window.Html5Qrcode) {
        alert("Library scanner belum termuat. Periksa internet lalu muat ulang halaman.");
        return;
      }

      prepareScanSound(); // Diaktifkan dari sentuhan tombol agar audio diizinkan browser.
      isStarting = true;
      scanSessionId++;
      scanQueue.length = 0;
      pendingCodes.clear();
      updateQueueStatus();

      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('btnStartScan').style.display = 'none';
      document.getElementById('btnStopScan').style.display = 'block';
      setScannerStatus("Mencari kamera belakang...");

      try {
        html5QrcodeScanner = new Html5Qrcode("reader", {
          verbose: false,
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
        });

        const config = {
          fps: 18,
          qrbox: (viewWidth, viewHeight) => {
            const side = Math.max(180, Math.min(360, Math.floor(Math.min(viewWidth, viewHeight) * 0.82)));
            return { width: side, height: side };
          },
          aspectRatio: 1.0,
          disableFlip: true,
        };

        // Pilih kamera belakang secara eksplisit berdasarkan label perangkat.
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          throw new Error("Tidak ada kamera yang terdeteksi pada perangkat.");
        }

        const rearCamera = cameras.find(camera =>
          /back|rear|environment|belakang|traseira|arrière/i.test(camera.label || "")
        );

        if (rearCamera) {
          await html5QrcodeScanner.start(
            rearCamera.id,
            config,
            onScanSuccess,
            onScanFailure
          );
        } else {
          // Fallback browser untuk perangkat yang tidak memberi label kamera.
          await html5QrcodeScanner.start(
            { facingMode: { ideal: "environment" } },
            config,
            onScanSuccess,
            onScanFailure
          );
        }

        isScanning = true;
        setScannerStatus("● KAMERA BELAKANG AKTIF — ARAHKAN QR GELANG BERIKUTNYA");
      } catch (err) {
        console.error("Gagal memulai kamera:", err);
        alert("Gagal mengakses kamera. Izinkan kamera dan buka melalui HTTPS. " + (err.message || err));
        await stopScanner();
      } finally {
        isStarting = false;
      }
    }

    async function stopScanner() {
      scanSessionId++;
      setScannerStatus("Scanner dihentikan.");
      if (html5QrcodeScanner) {
        try {
          if (isScanning) await html5QrcodeScanner.stop();
          html5QrcodeScanner.clear();
        } catch (err) {
          console.warn("Gagal menghentikan kamera:", err);
        }
      }
      isScanning = false;
      isStarting = false;
      scanQueue.length = 0;
      pendingCodes.clear();
      updateQueueStatus();
      document.getElementById('reader').style.display = 'none';
      document.getElementById('btnStartScan').style.display = 'block';
      document.getElementById('btnStopScan').style.display = 'none';
    }

    // Kamera tidak menunggu balasan server: QR baru masuk antrean sementara validasi berjalan.
    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      const qrText = String(decodedText || '').trim();
      if (!qrText || processedCodes.has(qrText) || pendingCodes.has(qrText)) return;

      const retryAfter = retryAfterByCode.get(qrText) || 0;
      if (Date.now() < retryAfter) return;

      if (scanQueue.length >= MAX_SCAN_QUEUE) {
        setScannerStatus("ANTRIAN PENUH — TUNGGU PROSES SELESAI SEBENTAR.");
        return;
      }

      pendingCodes.add(qrText);
      scanQueue.push(qrText);
      playScanShutter(); // Bunyi "cekrek" langsung saat QR baru terbaca.
      updateQueueStatus();
      setScannerStatus("QR TERBACA — MASUK ANTRIAN VALIDASI.");
      processScanQueue();
    }

    async function processScanQueue() {
      if (isProcessing || !isScanning || scanQueue.length === 0) return;

      const qrText = scanQueue.shift();
      const sessionAtStart = scanSessionId;
      isProcessing = true;
      updateQueueStatus();

      const payload = {
        action: "scanCheckpoint",
        pos: "3",
        petugas: document.getElementById('officerName').value.trim(),
        token_qr: qrText
      };

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
        let response;
        try {
          response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
            cache: "no-store",
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeoutId);
        }

        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();

        processedCodes.add(qrText);
        if (sessionAtStart === scanSessionId) {
          if (data && data.success) successCount++;
          else rejectCount++;
          showResult(data || { success: false, message: "Respons server kosong." });
        }
      } catch (error) {
        console.error("Kesalahan scan:", error);
        retryAfterByCode.set(qrText, Date.now() + 1500);
        if (sessionAtStart === scanSessionId) {
          showResult({ success: false, message: "Koneksi gagal. Gelang dapat dipindai ulang setelah koneksi pulih." });
          playAudioTone("error");
        }
      } finally {
        pendingCodes.delete(qrText);
        isProcessing = false;
        if (sessionAtStart === scanSessionId) {
          updateQueueStatus();
          if (isScanning && scanQueue.length > 0) {
            processScanQueue();
          } else if (isScanning) {
            setScannerStatus("● KAMERA AKTIF — SIAP SCAN BERIKUTNYA");
          }
        } else if (isScanning && scanQueue.length > 0) {
          processScanQueue();
        }
      }
    }

    function onScanFailure(error) {
      // Frame tanpa QR adalah kondisi normal; tidak perlu menampilkan pesan.
    }

    // Menampilkan Hasil Validasi
    function showResult(data) {
      const box = document.getElementById('resultBox');
      const title = document.getElementById('resultTitle');
      const detail = document.getElementById('resultDetail');
      
      box.style.display = 'block';
      box.className = 'card result-box ' + (data.success ? 'success' : 'error');
      
      if (data.success) {
        title.textContent = "✅ BERHASIL — POS FINISH";
        detail.innerHTML = `
          <strong>Nomor:</strong> ${data.nomor}<br>
          <strong>Nama:</strong> ${data.nama}<br>
          <strong>Status:</strong> ${data.status_peserta}<br>
          <strong>Waktu:</strong> ${data.waktu}
        `;
        playAudioTone('success');
        // Umumkan nama peserta setelah server menyatakan scan POS FINISH berhasil.
        speakParticipantName(data.nama);
      } else {
        title.textContent = "⛔ SCAN DITOLAK";
        detail.innerHTML = `
          <strong>Alasan:</strong> ${data.message}<br>
          <strong>Nomor:</strong> ${data.nomor || '-'}<br>
          <strong>Nama:</strong> ${data.nama || '-'}
        `;
        playAudioTone('error');
      }
    }

    // Nama peserta dibacakan setelah server mengonfirmasi scan berhasil.
    function speakParticipantName(nama) {
      if (!('speechSynthesis' in window) || !nama) return;
      speechQueue.push(String(nama).trim());
      processSpeechQueue();
    }

    function processSpeechQueue() {
      if (isSpeakingQueue || !speechQueue.length || !('speechSynthesis' in window)) return;
      isSpeakingQueue = true;
      const utterance = new SpeechSynthesisUtterance(speechQueue.shift());
      utterance.lang = "id-ID";
      utterance.rate = 1.05;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const indoVoice = voices.find(v => (v.lang || "").toLowerCase().startsWith("id"));
      if (indoVoice) utterance.voice = indoVoice;

      utterance.onend = utterance.onerror = () => {
        isSpeakingQueue = false;
        processSpeechQueue();
      };
      window.speechSynthesis.speak(utterance);
    }

    function dismissResult() {
      document.getElementById('resultBox').style.display = 'none';
    }

    // Kompatibilitas jika ada pemanggilan lama.
    function resetScanner() {
      dismissResult();
      if (!isScanning) startScanner();
    }

    // Bunyi Beep Sederhana menggunakan Web Audio API
    function playAudioTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) { console.log("Audio not supported"); }
    }

    // PWA: daftarkan service worker agar aplikasi dapat dipasang di layar utama.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => {
          console.warn("Service worker belum terdaftar:", err);
        });
      });
    }

    // Tombol instalasi tampil pada browser yang mendukung prompt instalasi.
    let deferredInstallPrompt = null;
    const installArea = document.getElementById("installArea");
    const installButton = document.getElementById("installAppBtn");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      if (installArea) installArea.style.display = "block";
    });

    if (installButton) {
      installButton.addEventListener("click", async () => {
        if (!deferredInstallPrompt) {
          alert("Jika tombol instalasi tidak tersedia: buka menu Chrome (⋮), lalu pilih 'Tambahkan ke layar utama' atau 'Instal aplikasi'.");
          return;
        }
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installArea.style.display = "none";
      });
    }

    window.addEventListener("appinstalled", () => {
      if (installArea) installArea.style.display = "none";
      console.log("Scanner POS FINISH berhasil dipasang.");
    });
  </script>
</body>
</html>
