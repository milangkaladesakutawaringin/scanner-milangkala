<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner POS - Milangkala 44</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Library QR Scanner yang Handal untuk HP -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-color: #04091a;
      --card-bg: rgba(13, 30, 72, 0.95);
      --gold: #fbbf24;
      --gold-grad: linear-gradient(180deg, #ffe082 0%, #f59e0b 55%, #d97706 100%);
      --text: #f8fafc;
      --success: #10b981;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
    .header h1 { font-size: 1.4rem; color: var(--gold); font-weight: 800; text-transform: uppercase; }
    .header p { font-size: 0.8rem; color: #cbd5e1; margin-top: 5px; }

    .card { background: var(--card-bg); border: 2px solid rgba(251, 191, 36, 0.4); border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid rgba(56, 189, 248, 0.4); background: rgba(6, 14, 36, 0.9); color: white; font-size: 1rem; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s; }
    .btn-gold { background: var(--gold-grad); color: #08122c; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
    .btn-gold:active { transform: scale(0.98); }
    .btn-stop { background: #1e293b; color: white; border: 1.5px solid #475569; margin-top: 10px; display: none; }

    #reader { width: 100%; max-width: 500px; border-radius: 10px; overflow: hidden; border: 2px dashed var(--gold); margin-top: 15px; display: none; background:#000; }
    #reader video { object-fit: cover !important; }
    #reader__dashboard_section_csr button { border-radius:8px !important; padding:8px 12px !important; }
    #scanStatus { max-width:500px; }
    
    .result-box { display: none; margin-top: 15px; padding: 15px; border-radius: 12px; text-align: center; border: 2px solid transparent; }
    .result-box.success { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #a7f3d0; }
    .result-box.error { background: rgba(244, 63, 94, 0.2); border-color: var(--danger); color: #fecdd3; }
    .result-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
    .result-detail { font-size: 0.9rem; line-height: 1.5; }

    #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 9, 26, 0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { width: 50px; height: 50px; border: 5px solid rgba(251, 191, 36, 0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Scanner Checkpoint</h1>
    <p>Sistem Milangkala Desa Kutawaringin Ke-44</p>
  </div>

  <div class="card" id="setupCard">
    <div class="form-group">
      <label class="form-label">TUGAS CHECKPOINT</label>
      <div class="form-input" style="font-weight:800;color:var(--gold);text-align:center;letter-spacing:1px;">🏁 POS FINISH</div>
      <small style="display:block;color:#cbd5e1;margin-top:6px;">Semua gelang dipindai satu kali di pos terakhir.</small>
    </div>
    <div class="form-group">
      <label class="form-label">NAMA PETUGAS LAPANGAN</label>
      <input type="text" id="officerName" class="form-input" placeholder="Ketik nama Anda (misal: PETUGAS 1)" required>
    </div>
    <button class="btn btn-gold" id="btnStartScan" onclick="startScanner()">📷 MULAI SCAN FINISH</button>
    <button class="btn btn-stop" id="btnStopScan" onclick="stopScanner()">HENTIKAN SCANNER</button>
  </div>

  <div id="reader"></div>

  <div class="card" id="scanStatus" style="display:none;padding:12px;text-align:center;">
    <div id="cameraStatus" style="font-weight:800;color:var(--success);">● KAMERA AKTIF — SIAP SCAN</div>
    <div style="display:flex;justify-content:space-around;margin-top:10px;gap:8px;">
      <div><div id="successCount" style="font-size:1.5rem;font-weight:800;color:#34d399;">0</div><small>BERHASIL</small></div>
      <div><div id="rejectCount" style="font-size:1.5rem;font-weight:800;color:#fb7185;">0</div><small>DITOLAK</small></div>
      <div><div id="totalCount" style="font-size:1.5rem;font-weight:800;color:var(--gold);">0</div><small>TOTAL</small></div>
    </div>
  </div>

  <div class="card result-box" id="resultBox">
    <div class="result-title" id="resultTitle">STATUS SCAN</div>
    <div class="result-detail" id="resultDetail">Detail akan muncul di sini.</div>
    <div style="margin-top:12px;font-size:.8rem;font-weight:700;">KAMERA TETAP AKTIF — ARAHKAN KE GELANG BERIKUTNYA</div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold); font-weight:700;">Memvalidasi QR Code...</div>
  </div>

  <script>
    /**
     * ==========================================================
     * PENTING: TEMPEL URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
     * ==========================================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbyrjVOusQ__ChTzgTSM8QdXSiyZl4W0H-bLfJmxgrb2JxRq_R867b4QxeBUYFODuiaSAw/exec";

    let html5QrcodeScanner = null;
    let isScanning = false;
    let isProcessing = false;
    let isStarting = false;
    let lastDecodedText = "";
    let lastDecodedAt = 0;
    const processedCodes = new Set();
    let successCount = 0;
    let rejectCount = 0;

    const $ = (id) => document.getElementById(id);

    function updateCounters() {
      $("successCount").textContent = successCount;
      $("rejectCount").textContent = rejectCount;
      $("totalCount").textContent = successCount + rejectCount;
    }

    // Scanner hanya memiliki satu tugas: POS FINISH (kode backend = 3).
    async function startScanner() {
      if (isScanning || isStarting) return;
      const officer = $("officerName").value.trim();
      if (!officer || officer.length < 2) {
        alert("Mohon isi nama petugas terlebih dahulu!");
        $("officerName").focus();
        return;
      }
      if (!window.Html5Qrcode) {
        alert("Library scanner gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.");
        return;
      }

      isStarting = true;
      $("resultBox").style.display = "none";
      $("reader").style.display = "block";
      $("scanStatus").style.display = "block";
      $("btnStartScan").style.display = "none";
      $("btnStopScan").style.display = "block";
      $("cameraStatus").textContent = "● MENGAKTIFKAN KAMERA...";
      $("cameraStatus").style.color = "var(--gold)";

      try {
        html5QrcodeScanner = new Html5Qrcode("reader", { verbose: false });
        const config = {
          fps: 12,
          qrbox: (viewWidth, viewHeight) => {
            const side = Math.max(180, Math.min(280, Math.floor(Math.min(viewWidth, viewHeight) * 0.72)));
            return { width: side, height: side };
          },
          aspectRatio: 1.0,
          rememberLastUsedCamera: true,
          videoConstraints: { facingMode: "environment" }
        };

        await html5QrcodeScanner.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          onScanFailure
        );
        isScanning = true;
        $("cameraStatus").textContent = "● KAMERA AKTIF — SIAP SCAN";
        $("cameraStatus").style.color = "var(--success)";
      } catch (err) {
        console.error("Gagal memulai kamera:", err);
        $("cameraStatus").textContent = "KAMERA GAGAL DIAKTIFKAN";
        $("cameraStatus").style.color = "var(--danger)";
        alert("Gagal mengakses kamera. Buka melalui HTTPS/GitHub Pages dan izinkan akses kamera. Detail: " + (err.message || err));
        await stopScanner();
      } finally {
        isStarting = false;
      }
    }

    async function stopScanner() {
      $("cameraStatus").textContent = "SCANNER DIHENTIKAN";
      $("cameraStatus").style.color = "#cbd5e1";
      if (html5QrcodeScanner) {
        try {
          if (isScanning) await html5QrcodeScanner.stop();
          html5QrcodeScanner.clear();
        } catch (err) {
          console.warn("Proses menghentikan kamera:", err);
        }
      }
      isScanning = false;
      isProcessing = false;
      isStarting = false;
      $("reader").style.display = "none";
      $("btnStartScan").style.display = "block";
      $("btnStopScan").style.display = "none";
      $("scanStatus").style.display = "none";
    }

    // Kamera tidak dihentikan saat QR terbaca. Hanya proses request yang dikunci.
    async function onScanSuccess(decodedText) {
      if (!isScanning || isProcessing) return;
      const qrText = String(decodedText || "").trim();
      if (!qrText) return;

      const now = Date.now();
      if (processedCodes.has(qrText)) return;
      if (qrText === lastDecodedText && now - lastDecodedAt < 1800) return;
      lastDecodedText = qrText;
      lastDecodedAt = now;
      isProcessing = true;

      $("cameraStatus").textContent = "● MEMERIKSA GELANG...";
      $("cameraStatus").style.color = "var(--gold)";
      $("loadingOverlay").style.display = "flex";

      const payload = {
        action: "scanCheckpoint",
        pos: "3",
        petugas: $("officerName").value.trim(),
        token_qr: qrText
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          cache: "no-store"
        });
        if (!response.ok) throw new Error("Server merespons HTTP " + response.status);
        const data = await response.json();

        // Simpan hasil supaya QR yang masih terlihat di kamera tidak dikirim berkali-kali.
        processedCodes.add(qrText);
        if (data && data.success) successCount++;
        else rejectCount++;
        updateCounters();
        showResult(data || { success: false, message: "Respons server kosong." });
      } catch (error) {
        console.error("Kesalahan scan:", error);
        showResult({
          success: false,
          message: "Koneksi gagal. Periksa internet dan URL API, lalu pindai ulang gelang ini."
        });
        playAudioTone("error");
      } finally {
        $("loadingOverlay").style.display = "none";
        isProcessing = false;
        if (isScanning) {
          $("cameraStatus").textContent = "● KAMERA AKTIF — SIAP SCAN BERIKUTNYA";
          $("cameraStatus").style.color = "var(--success)";
        }
      }
    }

    function onScanFailure(error) {
      // Tidak perlu menampilkan error setiap frame saat QR belum terbaca.
    }

    function showResult(data) {
      const box = $("resultBox");
      const title = $("resultTitle");
      const detail = $("resultDetail");

      box.style.display = "block";
      box.className = "card result-box " + (data.success ? "success" : "error");

      if (data.success) {
        title.textContent = "✅ FINISH BERHASIL";
        detail.innerHTML = `
          <strong>Nomor:</strong> ${escapeHtml(data.nomor || "-")}<br>
          <strong>Nama:</strong> ${escapeHtml(data.nama || "-")}<br>
          <strong>Status:</strong> ${escapeHtml(data.status_peserta || "LULUS")}<br>
          <strong>Waktu:</strong> ${escapeHtml(data.waktu || "-")}
        `;
        playAudioTone("success");
      } else {
        title.textContent = "⛔ SCAN DITOLAK";
        detail.innerHTML = `
          <strong>Alasan:</strong> ${escapeHtml(data.message || "Validasi gagal.")}<br>
          <strong>Nomor:</strong> ${escapeHtml(data.nomor || "-")}<br>
          <strong>Nama:</strong> ${escapeHtml(data.nama || "-")}
        `;
        playAudioTone("error");
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    // Tombol lama tetap tersedia bila dipanggil dari browser/cache versi sebelumnya.
    function resetScanner() {
      $("resultBox").style.display = "none";
      if (!isScanning) startScanner();
    }

    // Bunyi Beep Sederhana menggunakan Web Audio API
    function playAudioTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) { console.log("Audio not supported"); }
    }
  </script>
</body>
</html>
