<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner POS - Milangkala 44</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Library QR Scanner yang Handal untuk HP -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-color: #04091a;
      --card-bg: rgba(13, 30, 72, 0.95);
      --gold: #fbbf24;
      --gold-grad: linear-gradient(180deg, #ffe082 0%, #f59e0b 55%, #d97706 100%);
      --text: #f8fafc;
      --success: #10b981;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
    .header h1 { font-size: 1.4rem; color: var(--gold); font-weight: 800; text-transform: uppercase; }
    .header p { font-size: 0.8rem; color: #cbd5e1; margin-top: 5px; }

    .card { background: var(--card-bg); border: 2px solid rgba(251, 191, 36, 0.4); border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid rgba(56, 189, 248, 0.4); background: rgba(6, 14, 36, 0.9); color: white; font-size: 1rem; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s; }
    .btn-gold { background: var(--gold-grad); color: #08122c; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
    .btn-gold:active { transform: scale(0.98); }
    .btn-stop { background: #1e293b; color: white; border: 1.5px solid #475569; margin-top: 10px; display: none; }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px dashed var(--gold); margin-top: 15px; display: none; }
    
    .result-box { display: none; margin-top: 15px; padding: 15px; border-radius: 12px; text-align: center; border: 2px solid transparent; }
    .result-box.success { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #a7f3d0; }
    .result-box.error { background: rgba(244, 63, 94, 0.2); border-color: var(--danger); color: #fecdd3; }
    .result-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
    .result-detail { font-size: 0.9rem; line-height: 1.5; }

    #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 9, 26, 0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { width: 50px; height: 50px; border: 5px solid rgba(251, 191, 36, 0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Scanner Checkpoint</h1>
    <p>Sistem Milangkala Desa Kutawaringin Ke-44</p>
  </div>

  <div class="card" id="setupCard">
    <div class="form-group">
      <label class="form-label">TUGAS POS CHECKPOINT</label>
      <select id="posSelect" class="form-select">
        <option value="1">POS 1 – START</option>
        <option value="2">POS 2 – CHECKPOINT</option>
        <option value="3">POS 3 – FINISH</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">NAMA PETUGAS LAPANGAN</label>
      <input type="text" id="officerName" class="form-input" placeholder="Ketik nama Anda (misal: PETUGAS 1)" required>
    </div>
    <button class="btn btn-gold" id="btnStartScan" onclick="startScanner()">📷 Buka Kamera Scanner</button>
    <button class="btn btn-stop" id="btnStopScan" onclick="stopScanner()">Tutup Kamera</button>
  </div>

  <div id="reader"></div>

  <div class="card result-box" id="resultBox">
    <div class="result-title" id="resultTitle">STATUS SCAN</div>
    <div class="result-detail" id="resultDetail">Detail akan muncul di sini.</div>
    <button class="btn btn-gold" style="margin-top:15px; padding:10px;" onclick="resetScanner()">Scan QR Lainnya</button>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold); font-weight:700;">Memvalidasi QR Code...</div>
  </div>

  <script>
    /**
     * ==========================================================
     * PENTING: TEMPEL URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
     * ==========================================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbyrjVOusQ__ChTzgTSM8QdXSiyZl4W0H-bLfJmxgrb2JxRq_R867b4QxeBUYFODuiaSAw/exec";

    let html5QrcodeScanner = null;
    let isScanning = false;

    // Memulai Kamera
    function startScanner() {
      const officer = document.getElementById('officerName').value.trim();
      if (!officer || officer.length < 2) {
        alert("Mohon isi nama petugas terlebih dahulu!");
        return;
      }
      
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('btnStartScan').style.display = 'none';
      document.getElementById('btnStopScan').style.display = 'block';

      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
      
      // Menggunakan kamera belakang (environment) secara default
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
      .then(() => { isScanning = true; })
      .catch((err) => {
        alert("Gagal mengakses kamera. Pastikan izin kamera diberikan. Error: " + err);
        stopScanner();
      });
    }

    // Menghentikan Kamera
    function stopScanner() {
      if (html5QrcodeScanner && isScanning) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          isScanning = false;
        }).catch(err => console.log(err));
      }
      document.getElementById('reader').style.display = 'none';
      document.getElementById('btnStartScan').style.display = 'block';
      document.getElementById('btnStopScan').style.display = 'none';
    }

    // Jika QR Berhasil Terbaca
    function onScanSuccess(decodedText, decodedResult) {
      if (!isScanning) return;
      
      // Hentikan scanner sementara agar tidak scan dua kali beruntun
      stopScanner();
      
      // Tampilkan loading
      document.getElementById('loadingOverlay').style.display = 'flex';

      const posValue = document.getElementById('posSelect').value;
      const officerValue = document.getElementById('officerName').value.trim();

      const payload = {
        action: "scanCheckpoint",
        pos: posValue,
        petugas: officerValue,
        token_qr: decodedText
      };

      // Kirim Data ke Google Apps Script (menggunakan text/plain untuk bypass CORS)
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loadingOverlay').style.display = 'none';
        showResult(data);
      })
      .catch(error => {
        document.getElementById('loadingOverlay').style.display = 'none';
        showResult({ success: false, message: "Koneksi Error. Pastikan internet lancar dan URL API benar." });
      });
    }

    function onScanFailure(error) {
      // Abaikan error saat mencari QR di frame
    }

    // Menampilkan Hasil Validasi
    function showResult(data) {
      const box = document.getElementById('resultBox');
      const title = document.getElementById('resultTitle');
      const detail = document.getElementById('resultDetail');
      
      box.style.display = 'block';
      box.className = 'card result-box ' + (data.success ? 'success' : 'error');
      
      if (data.success) {
        title.textContent = "✅ CHECKPOINT BERHASIL";
        detail.innerHTML = `
          <strong>Nomor:</strong> ${data.nomor}<br>
          <strong>Nama:</strong> ${data.nama}<br>
          <strong>Status:</strong> ${data.status_peserta}<br>
          <strong>Waktu:</strong> ${data.waktu}
        `;
        playAudioTone('success');
      } else {
        title.textContent = "⛔ SCAN DITOLAK";
        detail.innerHTML = `
          <strong>Alasan:</strong> ${data.message}<br>
          <strong>Nomor:</strong> ${data.nomor || '-'}<br>
          <strong>Nama:</strong> ${data.nama || '-'}
        `;
        playAudioTone('error');
      }
    }

    function resetScanner() {
      document.getElementById('resultBox').style.display = 'none';
      startScanner();
    }

    // Bunyi Beep Sederhana menggunakan Web Audio API
    function playAudioTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) { console.log("Audio not supported"); }
    }
  </script>
</body>
</html>
